spring.application.name=wellness-api
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wellness}
spring.datasource.username=${DB_USER:wellness}
spring.datasource.password=${DB_PASSWORD:wellness}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=86400
app.google.client-ids=${GOOGLE_CLIENT_IDS:}
app.admin.email=${ADMIN_EMAIL:admin@mr-care.app}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# Gmail SMTP: keep SMTP_APP_PASSWORD outside source control and enable only after setup.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.enabled=${SMTP_ENABLED:false}
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.password-reset.otp-expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.password-reset.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.password-reset.max-attempts=${OTP_MAX_ATTEMPTS:5}

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.wellnessapp=INFO

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
app.demo.seed-enabled=${DEMO_SEED_ENABLED:false}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
app.meal-post.retention-cron=${MEAL_POST_RETENTION_CRON:0 20 0 * * *}

# Enable only after configuring an Android development/production build and FCM credentials.
app.schedulers.enabled=${SCHEDULERS_ENABLED:true}
app.push.enabled=${PUSH_ENABLED:false}
app.push.expo-access-token=${EXPO_ACCESS_TOKEN:}
