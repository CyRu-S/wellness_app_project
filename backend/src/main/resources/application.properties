spring.application.name=wellness-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wellness}
spring.datasource.username=${DB_USER:wellness}
spring.datasource.password=${DB_PASSWORD:wellness}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:d2VsbG5lc3MtYXBwLWRldmVsb3BtZW50LXNlY3JldC1rZXktMjAyNg==}
app.jwt.expiration-seconds=86400

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.wellnessapp=INFO

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
