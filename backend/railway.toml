[build]
builder = "RAILPACK"
buildCommand = "mvn -B -DskipTests clean package"

[deploy]
startCommand = "java -Xms64m -Xmx192m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -XX:ActiveProcessorCount=2 -XshowSettings:vm -jar target/*.jar"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
