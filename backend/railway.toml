[build]
builder = "RAILPACK"
buildCommand = "mvn -B -DskipTests clean package"

[deploy]
startCommand = "java -Xms64m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:ActiveProcessorCount=2 -XshowSettings:vm -jar target/*.jar"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
