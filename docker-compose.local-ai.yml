services:
  ollama:
    image: ollama/ollama:0.40.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "4"
    volumes:
      - local_food_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 8g

  model-init:
    image: ollama/ollama:0.40.0
    profiles: ["setup"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_NO_CLOUD: "1"
    command: ["pull", "${FOOD_ANALYSIS_MODEL:-qwen3-vl:2b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  local_food_models:
